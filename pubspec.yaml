name: alertguard_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # HTTP requests to Django backend
  dio: ^5.4.0   


# Secure token storage (Keychain on iOS, Keystore on Android)
  flutter_secure_storage: ^9.0.0


  # Navigation
  go_router: ^13.0.0



 # State management
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0


  # UI
  cupertino_icons: ^1.0.6

# Shake detection
  sensors_plus: ^4.0.2

  # Volume button detection (works in background)
  volume_controller: ^2.0.6

  # Keep app alive in background
  flutter_background_service: ^5.0.5

  # Local notifications (countdown alert, cancel option)
  flutter_local_notifications: ^17.0.0

  # SharedPreferences for non-sensitive settings (silent mode toggle)
  shared_preferences: ^2.2.2

  # Open Telegram directly for invite sharing
  url_launcher: ^6.3.0

 # Native share sheet (WhatsApp, SMS, copy, etc.)
  share_plus: ^9.0.0

# GPS location
  geolocator: ^11.0.0

  # Camera capture
  camera: ^0.10.5+9

  # File path handling
  path_provider: ^2.1.2
  path: ^1.9.0


  # Connectivity detection
  connectivity_plus: ^6.0.3

  # Local SQLite database for offline queue
  sqflite: ^2.3.2

  # Internet reachability check (connectivity_plus only checks network, not internet)
  internet_connection_checker_plus: ^2.5.1


  # Smooth page indicator for onboarding dots
  smooth_page_indicator: ^1.1.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  riverpod_generator: ^2.3.0

flutter:
  uses-material-design: true
